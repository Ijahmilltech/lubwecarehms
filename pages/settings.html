<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LubweCare Settings</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="main">

    <div class="topbar">

        <div>
            <h1>⚙️ System Settings</h1>
            <p>Manage hospital system preferences</p>
        </div>

    </div>

    <!-- SETTINGS CARDS -->

    <div class="cards">

        <div class="card">

            <h3>Hospital Name</h3>

            <br>

            <input type="text" class="search" value="Lubwe Mission Hospital">

        </div>

        <div class="card">

            <h3>Administrator Email</h3>

            <br>

            <input type="email" class="search" value="admin@lubwecare.com">

        </div>

    </div>

    <!-- SETTINGS PANEL -->

    <div class="chart-box">

        <h3>System Preferences</h3>

        <br>

        <label>
            <input type="checkbox" checked>
            Enable Notifications
        </label>

        <br><br>

        <label>
            <input type="checkbox" checked>
            Enable AI Predictions
        </label>

        <br><br>

        <label>
            <input type="checkbox">
            Dark Mode
        </label>

        <br><br>

        <label>
            <input type="checkbox" checked>
            Email Reports Automatically
        </label>

        <br><br>

        <button class="btn">
            Save Settings
        </button>

    </div>

    <br>

    <!-- SECURITY -->

    <div class="chart-box">

        <h3>🔒 Security</h3>

        <br>

        <input type="password" class="search" placeholder="New Password">

        <br><br>

        <input type="password" class="search" placeholder="Confirm Password">

        <br><br>

        <button class="btn">
            Update Password
        </button>

    </div>

</div>

</body>
</html>
